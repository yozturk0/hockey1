# Deploy on Fly.io:  fly launch --copy-config --now
app = "air-hockey"
primary_region = "fra"   # Frankfurt — düşük ping için Türkiye'ye en yakın bölge

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
